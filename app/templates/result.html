{% extends "base.html" %}
{% block title %}Résultat - CVBoost{% endblock %}
{% block content %}
<div class="result-container">
    <h2>Mes résultats</h2>
    <div class="doc-info">
        <p><strong>Document :</strong> {{ document.original_filename }}</p>
        <p><strong>Statut :</strong> {{ document.status }}</p>
    </div>
    <div class="ia-card">
        <h3>Analyse IA bientôt disponible</h3>
        <div class="progress-bar-placeholder"></div>
    </div>
    <a href="{{ url_for('history') }}" class="btn-secondary">Retour à l'historique</a>
</div>
{% endblock %}
