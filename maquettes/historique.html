<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Historique - CVBoost</title>
<link rel="stylesheet" href="commun.css">
<style>
.page { max-width: 1000px; margin: 0 auto; padding: 40px 16px 80px; }
.page h1 { font-size: clamp(2.2rem, 5vw, 3.2rem); margin-bottom: 6px; }
.page .sous { color: var(--doux); margin: 0 0 28px; font-size: 1.1rem; }

/* Selecteur a deux onglets, facon Apple : une pilule blanche glisse sous l'onglet choisi */
.onglets { display: inline-grid; grid-template-columns: 1fr 1fr; position: relative; padding: 5px; border-radius: 999px; margin-bottom: 22px; }
.onglets button { position: relative; z-index: 1; border: none; background: none; font: inherit; font-weight: 600; color: var(--doux);
  padding: 10px 22px; border-radius: 999px; cursor: pointer; transition: color .25s; white-space: nowrap; }
.onglets button.actif { color: var(--texte); }
.onglets .pilule { position: absolute; top: 5px; bottom: 5px; left: 5px; width: calc(50% - 5px); border-radius: 999px; background: #fff;
  box-shadow: 0 2px 10px rgba(20,30,60,.12); transition: transform .3s cubic-bezier(.3,.7,.2,1); }
.onglets.droite .pilule { transform: translateX(100%); }
.compte-nb { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; margin-left: 6px; border-radius: 999px;
  font-size: .75rem; background: rgba(10,108,255,.12); color: var(--accent); }

/* Cartes communes aux deux onglets */
.element { padding: 22px 24px; margin-bottom: 14px; animation: monte .45s ease-out both; animation-delay: calc(var(--i) * .08s); }
@keyframes monte { from { opacity: 0; transform: translateY(14px); } }
.element h3 { margin: 0 0 4px; font-size: 1.15rem; }
.infos { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--doux); font-size: .92rem; }
.infos span { display: inline-flex; align-items: center; gap: 5px; }
.infos .icone { width: 17px; height: 17px; vertical-align: 0; }

/* Offre favorite : coeur, echeance, temps restant, dernier entretien, actions */
.favori { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; }
.favori > div { min-width: 0; }   /* le contenu ne deborde jamais de la carte */
.titre-favori { display: flex; align-items: flex-start; gap: 12px; }
.coeur { flex: none; width: 38px; height: 38px; border-radius: 50%; border: none; cursor: pointer; display: grid; place-items: center;
  background: rgba(122,92,255,.12); color: var(--mauve); transition: transform .2s; }
.coeur .icone { fill: currentColor; }
.coeur:active { transform: scale(.85); }
.echeance { margin-top: 14px; max-width: 460px; }
.echeance .haut { display: flex; flex-wrap: wrap; gap: 6px; justify-content: space-between; align-items: center; font-size: .88rem; margin-bottom: 6px; }
.badge { padding: 3px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; }
.badge.large { background: rgba(30,125,79,.12); color: #1e7d4f; }
.badge.bientot { background: rgba(242,183,5,.2); color: #8a6400; }
.badge.close { background: #e9ecf1; color: #6b7280; }
.badge.inconnue { background: #eef1f5; color: var(--doux); }
.temps { height: 6px; border-radius: 6px; background: #e3e8f0; overflow: hidden; }
.temps i { display: block; height: 100%; border-radius: 6px; background: var(--couleur); width: 0; animation: remplit 1s ease-out .3s forwards; }
@keyframes remplit { to { width: var(--n); } }
.entretien { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: .9rem; color: var(--doux); }
.mini-note { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: .75rem; font-weight: 800; color: var(--accent);
  background: conic-gradient(var(--accent) calc(var(--n) * 1%), #e3e8f0 0); position: relative; }
.mini-note::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: #fff; }
.mini-note span { position: relative; }
.actions { display: flex; flex-direction: column; gap: 10px; }
.actions .btn { justify-content: center; padding: 11px 20px; box-shadow: none; white-space: nowrap; }
.btn.mauve { background: var(--mauve); }

/* Carte d'un CV */
.cv { display: flex; gap: 16px; align-items: center; }
.type { width: 46px; height: 56px; flex: none; border-radius: 10px; display: grid; place-items: end center; padding-bottom: 8px;
  font-size: .68rem; font-weight: 800; color: #fff; background: #d64541; }
.type.docx { background: #2b6cd9; }
.cv .milieu { flex: 1; }
.puces { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.puces span { padding: 4px 11px; border-radius: 999px; font-size: .8rem; font-weight: 600; background: rgba(10,108,255,.1); color: var(--accent); }
.cv .btn { box-shadow: none; padding: 11px 18px; white-space: nowrap; }

.vide { text-align: center; padding: 40px 24px; }
.vide .icone { width: 40px; height: 40px; color: var(--mauve); }
.vide p { color: var(--doux); max-width: 26em; margin: 10px auto 18px; }

@media (max-width: 720px) {
  .favori { grid-template-columns: 1fr; }
  .actions .btn { width: 100%; }
  .cv { flex-wrap: wrap; } .cv .btn { width: 100%; justify-content: center; }
  .onglets button { padding: 10px 14px; }
}
</style></head>
<body data-page="historique" data-connecte>

<main class="page">
  <h1>Votre historique.</h1>
  <p class="sous">Vos offres favorites et vos CV, au même endroit.</p>

  <div class="onglets verre" id="onglets">
    <span class="pilule"></span>
    <button class="actif" data-onglet="favoris">Offres favorites<span class="compte-nb" id="nb-favoris"></span></button>
    <button data-onglet="cv">Mes CV<span class="compte-nb" id="nb-cv"></span></button>
  </div>

  <section id="favoris"></section>
  <section id="cv" hidden></section>
</main>

<script src="commun.js"></script>
<script>
// Maquette uniquement : dans le vrai site, ces listes viennent de la base (tables Favori et Document)
// et les jours restants sont calcules en Python.
const AUJOURDHUI = new Date('2026-10-28');
const FAVORIS = [
  { titre: 'Chef Comptable', entreprise: 'SODEICO Sarl', lieu: 'Kinshasa', publiee: '2026-10-07', cloture: '2026-10-31', note: 82 },
  { titre: 'Spécialiste fiscal', entreprise: 'Digby Wells Environmental', lieu: 'Kinshasa', publiee: '2026-10-21', cloture: '2026-11-16', note: null },
  { titre: 'Assistants Financiers (Finance Associates)', entreprise: 'FHI360', lieu: 'Beni, Buta et Kolwezi', publiee: '2026-10-23', cloture: null, note: null },
  { titre: 'Project Finance Officer', entreprise: 'CBM', lieu: 'Bukavu et Goma', publiee: '2026-10-12', cloture: '2026-10-25', note: 64 },
];
const MES_CV = [
  { nom: 'CV_Grace_Mbuyi.pdf', type: 'pdf', depose: '28 octobre 2026', competences: ['Comptabilité', 'Finance', 'Bureautique', 'Anglais'] },
  { nom: 'CV_Grace_2025.docx', type: 'docx', depose: '20 octobre 2026', competences: ['Comptabilité', 'Bureautique'] },
];
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const JOUR = 24 * 3600 * 1000;

function enFrancais(texte) {
  const date = new Date(texte);
  return date.getDate() + ' ' + MOIS[date.getMonth()] + ' ' + date.getFullYear();
}

// Echeance d'une offre : texte, badge et part du temps deja ecoulee entre la publication et la cloture
function echeance(offre) {
  if (!offre.cloture) {
    return { texte: 'Date limite non précisée', badge: 'inconnue', etiquette: "Voir l'annonce", part: 0, couleur: '#c5ccd8' };
  }
  const restants = Math.round((new Date(offre.cloture) - AUJOURDHUI) / JOUR);
  const total = (new Date(offre.cloture) - new Date(offre.publiee)) / JOUR;
  const part = Math.min(100, Math.round((total - restants) / total * 100));
  const texte = 'Clôture le ' + enFrancais(offre.cloture);
  if (restants < 0) return { texte, badge: 'close', etiquette: 'Clôturée', part: 100, couleur: '#c5ccd8' };
  if (restants <= 7) return { texte, badge: 'bientot', etiquette: 'Plus que ' + restants + ' jours', part, couleur: '#f2b705' };
  return { texte, badge: 'large', etiquette: restants + ' jours restants', part, couleur: '#1e7d4f' };
}

function carteFavori(offre, i) {
  const fin = echeance(offre);
  const entretien = offre.note
    ? `<div class="entretien"><span class="mini-note" style="--n:${offre.note}"><span>${offre.note}</span></span> Dernier entretien : ${offre.note} / 100</div>`
    : '<div class="entretien">Pas encore d\'entretien sur ce poste</div>';
  return `
  <article class="element favori verre" style="--i:${i}">
    <div>
      <div class="titre-favori">
        <button class="coeur" aria-label="Retirer des favoris"><svg class="icone"><use href="#i-coeur"/></svg></button>
        <div><h3>${offre.titre}</h3>
          <div class="infos"><span>${offre.entreprise}</span><span><svg class="icone"><use href="#i-lieu"/></svg>${offre.lieu}</span></div></div>
      </div>
      <div class="echeance">
        <div class="haut"><span><svg class="icone" style="width:17px;height:17px"><use href="#i-calendrier"/></svg> ${fin.texte}</span>
          <span class="badge ${fin.badge}">${fin.etiquette}</span></div>
        <div class="temps"><i style="--n:${fin.part}%; --couleur:${fin.couleur}"></i></div>
      </div>
      ${entretien}
    </div>
    <div class="actions">
      <a class="btn mauve" href="#"><svg class="icone"><use href="#i-micro"/></svg> ${offre.note ? 'Refaire un entretien' : "Lancer l'entretien"}</a>
      <a class="btn clair" href="#">Voir l'offre</a>
    </div>
  </article>`;
}

function carteCV(cv, i) {
  return `
  <article class="element cv verre" style="--i:${i}">
    <span class="type ${cv.type}">${cv.type.toUpperCase()}</span>
    <div class="milieu"><h3>${cv.nom}</h3><div class="infos"><span>Déposé le ${cv.depose}</span></div>
      <div class="puces">${cv.competences.map(nom => `<span>${nom}</span>`).join('')}</div></div>
    <a class="btn" href="resultats.html">Voir mes opportunités <svg class="icone fleche"><use href="#i-fleche"/></svg></a>
  </article>`;
}

const favoris = location.search.includes('vide') ? [] : FAVORIS;
document.getElementById('nb-favoris').textContent = favoris.length;
document.getElementById('nb-cv').textContent = MES_CV.length;
document.getElementById('favoris').innerHTML = favoris.length ? favoris.map(carteFavori).join('') : `
  <div class="vide verre"><svg class="icone"><use href="#i-coeur"/></svg>
    <h3>Aucune offre favorite pour l'instant</h3>
    <p>Ouvrez une offre qui vous plaît et touchez le cœur : elle vous attendra ici, avec sa date de clôture.</p>
    <a class="btn" href="resultats.html">Voir mes opportunités</a></div>`;
document.getElementById('cv').innerHTML = MES_CV.map(carteCV).join('');

// Onglets : la pilule glisse et la bonne liste s'affiche
document.querySelectorAll('#onglets button').forEach(bouton => {
  bouton.addEventListener('click', () => {
    document.querySelectorAll('#onglets button').forEach(autre => autre.classList.toggle('actif', autre === bouton));
    document.getElementById('onglets').classList.toggle('droite', bouton.dataset.onglet === 'cv');
    document.getElementById('favoris').hidden = bouton.dataset.onglet !== 'favoris';
    document.getElementById('cv').hidden = bouton.dataset.onglet !== 'cv';
  });
});

// Coeur : retirer une offre des favoris (la carte s'efface)
document.querySelectorAll('.coeur').forEach(coeur => {
  coeur.addEventListener('click', () => {
    const carte = coeur.closest('.favori');
    carte.style.transition = 'opacity .3s, transform .3s';
    carte.style.opacity = 0;
    carte.style.transform = 'scale(.97)';
    setTimeout(() => carte.remove(), 300);
  });
});
</script>
</body></html>
