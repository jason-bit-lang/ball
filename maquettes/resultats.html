<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vos opportunités - CVBoost</title>
<link rel="stylesheet" href="commun.css">
<style>
.page { max-width: 1100px; margin: 0 auto; padding: 30px 16px 80px; }

/* Bandeau du haut, facon page d'artiste : teinte de couleur et resume de l'analyse */
.bandeau { padding: 34px; border-radius: 30px; position: relative; overflow: hidden;
  background: linear-gradient(135deg, rgba(10,108,255,.16), rgba(242,183,5,.12)), var(--verre); }
.termine { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; font-size: .85rem; font-weight: 700;
  color: #1e7d4f; background: rgba(30,125,79,.12); }
.bandeau h1 { font-size: clamp(2.2rem, 5vw, 3.4rem); margin: 16px 0 6px; }
.bandeau .meta { color: var(--doux); margin: 0 0 22px; }
.etiquette { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--doux); margin: 0 0 8px; }
.puces { display: flex; flex-wrap: wrap; gap: 8px; }
.puce { padding: 6px 14px; border-radius: 999px; font-size: .85rem; font-weight: 600; background: #fff; color: var(--accent); box-shadow: 0 2px 8px rgba(20,30,60,.06); }
.puce.atout { background: rgba(10,108,255,.1); box-shadow: none; }
.puce.renforcer { background: rgba(242,183,5,.18); color: #8a6400; box-shadow: none; }
.bandeau .puce { opacity: 0; animation: surgit .4s ease-out forwards; animation-delay: calc(.3s + var(--i) * .12s); }
@keyframes surgit { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }

/* Filtres par niveau */
.filtres { display: flex; gap: 8px; margin: 30px 0 6px; overflow-x: auto; scrollbar-width: none; }
.filtres button { flex: none; }
.filtres button { padding: 9px 18px; border-radius: 999px; border: 1px solid var(--bord); background: var(--verre); font: inherit;
  font-weight: 600; color: var(--doux); cursor: pointer; transition: all .2s; }
.filtres button.actif { background: var(--texte); color: #fff; border-color: var(--texte); }

/* Carte d'une offre : jauge du niveau, informations, competences, actions */
.offre { display: grid; grid-template-columns: 92px 1fr auto; gap: 22px; align-items: center; padding: 22px 24px; margin-top: 14px;
  opacity: 0; animation: monte .5s ease-out forwards; animation-delay: calc(var(--i) * .12s); transition: transform .25s; }
.offre:hover { transform: translateY(-3px); }
@keyframes monte { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
.jauge { text-align: center; }
.jauge .rond { width: 68px; height: 68px; margin: 0 auto 6px; border-radius: 50%; position: relative;
  background: conic-gradient(var(--couleur) calc(var(--n) * 1%), #e3e8f0 0); }
.jauge .rond::after { content: ""; position: absolute; inset: 7px; border-radius: 50%; background: #fff; }
.jauge small { font-weight: 700; font-size: .78rem; color: var(--couleur); }
.offre h3 { margin: 0 0 4px; font-size: 1.2rem; letter-spacing: -0.01em; }
.infos { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--doux); font-size: .92rem; margin-bottom: 12px; }
.infos span { display: inline-flex; align-items: center; gap: 5px; }
.infos .icone { width: 17px; height: 17px; vertical-align: 0; }
.nouvelle { padding: 2px 10px; border-radius: 999px; background: var(--accent); color: #fff; font-size: .75rem; font-weight: 700; }
.ligne-puces { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 6px; }
.ligne-puces b { font-size: .8rem; color: var(--doux); margin-right: 4px; font-weight: 600; }
.ligne-puces .puce { padding: 4px 11px; font-size: .8rem; }
.actions { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.actions .btn { justify-content: center; padding: 11px 20px; box-shadow: none; }
.actions .btn.clair { font-size: .9rem; }
.encore { text-align: center; margin-top: 34px; color: var(--doux); }
.encore a { color: var(--accent); font-weight: 600; text-decoration: none; }
@media (max-width: 760px) {
  .bandeau { padding: 26px 22px; }
  .offre { grid-template-columns: 70px 1fr; gap: 14px; padding: 18px; }
  .jauge .rond { width: 54px; height: 54px; }
  .actions { grid-column: 1 / -1; flex-direction: row; }
  .actions .btn { flex: 1; }
}
</style></head>
<body data-page="resultats" data-connecte>

<main class="page">
  <section class="bandeau verre">
    <span class="termine"><svg class="icone"><use href="#i-coche"/></svg> Analyse terminée</span>
    <h1>Vos opportunités.</h1>
    <p class="meta">D'après CV_Grace_Mbuyi.pdf · analysé le 28 octobre 2026</p>
    <p class="etiquette">Compétences repérées dans votre CV</p>
    <div class="puces">
      <span class="puce" style="--i:0">Comptabilité</span><span class="puce" style="--i:1">Finance</span>
      <span class="puce" style="--i:2">Bureautique</span><span class="puce" style="--i:3">Anglais</span>
    </div>
  </section>

  <div class="filtres" id="filtres">
    <button class="actif" data-niveau="tous">Toutes</button>
    <button data-niveau="tres-proche">Très proches</button>
    <button data-niveau="proche">Proches</button>
    <button data-niveau="explorer">À explorer</button>
  </div>

  <div id="liste"></div>

  <p class="encore">Ce n'est pas tout à fait vous ? <a href="envoi.html">Propulsez une autre version de votre CV</a></p>
</main>

<script src="commun.js"></script>
<script>
// Maquette uniquement : dans le vrai site, ces cartes sont ecrites par Jinja (boucle sur les resultats du matching)
const NIVEAUX = {
  'tres-proche': { nom: 'Très proche', couleur: '#1e7d4f', jauge: 90 },
  'proche': { nom: 'Proche', couleur: '#0a6cff', jauge: 65 },
  'explorer': { nom: 'À explorer', couleur: '#8a93a3', jauge: 35 },
};
const OFFRES = [
  { titre: 'Chef Comptable', entreprise: 'SODEICO Sarl', lieu: 'Kinshasa', date: '7 octobre 2026', nouvelle: false, niveau: 'tres-proche',
    atouts: ['Comptabilité', 'Finance', 'Bureautique'], renforcer: ['Ingénierie'] },
  { titre: 'Directeur Administratif et Financier Bilingue', entreprise: 'SODEICO Sarl', lieu: 'Kinshasa', date: '7 octobre 2026', nouvelle: false,
    niveau: 'tres-proche', atouts: ['Comptabilité', 'Finance', 'Bureautique', 'Anglais'], renforcer: ['Ingénierie'] },
  { titre: 'Assistants Financiers (Finance Associates)', entreprise: 'FHI360', lieu: 'Beni, Buta et Kolwezi', date: '23 octobre 2026', nouvelle: true,
    niveau: 'proche', atouts: ['Comptabilité', 'Finance', 'Bureautique'], renforcer: [] },
  { titre: 'Spécialiste fiscal', entreprise: 'Digby Wells Environmental', lieu: 'Kinshasa', date: '21 octobre 2026', nouvelle: true,
    niveau: 'proche', atouts: ['Comptabilité', 'Finance'], renforcer: ['Ressources humaines', 'Environnement'] },
  { titre: 'Project Finance Officer', entreprise: 'CBM', lieu: 'Bukavu et Goma', date: '12 octobre 2026', nouvelle: false,
    niveau: 'explorer', atouts: ['Comptabilité', 'Finance'], renforcer: ['Logistique'] },
];

function puces(liste, classe) {
  return liste.map(nom => `<span class="puce ${classe}">${nom}</span>`).join('');
}

document.getElementById('liste').innerHTML = OFFRES.map((offre, i) => {
  const niveau = NIVEAUX[offre.niveau];
  return `
  <article class="offre verre" data-niveau="${offre.niveau}" style="--i:${i}; --couleur:${niveau.couleur}; --n:${niveau.jauge}">
    <div class="jauge"><div class="rond"></div><small>${niveau.nom}</small></div>
    <div>
      <h3>${offre.titre}</h3>
      <div class="infos">
        <span>${offre.entreprise}</span>
        <span><svg class="icone"><use href="#i-lieu"/></svg>${offre.lieu}</span>
        <span><svg class="icone"><use href="#i-calendrier"/></svg>Publiée le ${offre.date}</span>
        ${offre.nouvelle ? '<span class="nouvelle">Nouvelle</span>' : ''}
      </div>
      <div class="ligne-puces"><b>Vos atouts</b>${puces(offre.atouts, 'atout')}</div>
      ${offre.renforcer.length ? `<div class="ligne-puces"><b>À renforcer</b>${puces(offre.renforcer, 'renforcer')}</div>` : ''}
    </div>
    <div class="actions">
      <a class="btn" href="#">Voir l'offre <svg class="icone fleche"><use href="#i-fleche"/></svg></a>
      <a class="btn clair" href="#"><svg class="icone"><use href="#i-micro"/></svg> S'entraîner</a>
    </div>
  </article>`;
}).join('');

// Filtres : n'affichent que les offres du niveau choisi
document.querySelectorAll('#filtres button').forEach(bouton => {
  bouton.addEventListener('click', () => {
    document.querySelectorAll('#filtres button').forEach(autre => autre.classList.remove('actif'));
    bouton.classList.add('actif');
    document.querySelectorAll('.offre').forEach(carte => {
      carte.hidden = bouton.dataset.niveau !== 'tous' && carte.dataset.niveau !== bouton.dataset.niveau;
    });
  });
});
</script>
</body></html>
