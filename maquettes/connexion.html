<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion - CVBoost</title>
<link rel="stylesheet" href="commun.css">
<script src="theme.js"></script>
<style>
/* Decor : trois cartes de verre qui flottent doucement, comme des souvenirs de l'application */
.decor { position: relative; height: 270px; margin-top: 34px; max-width: 470px; }
.flotte { position: absolute; padding: 14px 18px; border-radius: 20px; animation: flotte 6s ease-in-out infinite alternate; animation-delay: var(--d); }
@keyframes flotte { from { transform: translateY(0); } to { transform: translateY(-14px); } }
.flotte b { display: block; } .flotte small { color: var(--doux); }
.mini-niveau { height: 6px; width: 180px; border-radius: 6px; background: var(--piste); margin-top: 8px; overflow: hidden; }
.mini-niveau i { display: block; height: 100%; width: 92%; background: var(--accent); border-radius: 6px; }
.mini-onde { display: flex; align-items: center; gap: 3px; height: 26px; margin-top: 6px; }
.mini-onde i { width: 4px; border-radius: 4px; background: var(--accent); animation: onde 1.2s ease-in-out infinite; animation-delay: calc(var(--i) * -0.15s); }
@keyframes onde { 0%, 100% { height: 25%; } 50% { height: 100%; } }
.note { display: flex; gap: 12px; align-items: center; }
.note span { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: var(--accent);
  background: conic-gradient(var(--accent) 82%, var(--piste) 0); position: relative; }
.note span::before { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--surface); }
.note span em { position: relative; font-style: normal; font-size: .9rem; }
</style></head>
<body data-page="connexion">

<main class="compte">
  <div>
    <h1>Bon retour parmi nous.</h1>
    <p class="sous">Vos offres et votre recruteuse vous attendent.</p>
    <div class="decor" aria-hidden="true">
      <div class="flotte verre" style="left: 0; top: 10px; --d: 0s">
        <b>Chef comptable</b><small>Kinshasa · Très proche</small><div class="mini-niveau"><i></i></div>
      </div>
      <div class="flotte verre" style="left: 210px; top: 95px; --d: -2s">
        <b>Entretien vocal</b><small>La recruteuse vous écoute</small>
        <div class="mini-onde"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i></div>
      </div>
      <div class="flotte verre note" style="left: 20px; top: 200px; --d: -4s">
        <span><em>82</em></span><div><b>Votre note</b><small>Communication 8 / 10</small></div>
      </div>
    </div>
  </div>

  <form class="formulaire verre" method="POST">
    <h2>Connexion</h2>
    <div class="alerte" id="alerte" hidden>Email ou mot de passe incorrect.</div>
    <div class="champ"><input type="email" name="email" id="email" placeholder=" " autocomplete="email" required><label for="email">Email</label></div>
    <div class="champ">
      <input type="password" name="password" id="password" placeholder=" " autocomplete="current-password" required><label for="password">Mot de passe</label>
      <button type="button" class="voir" aria-label="Afficher le mot de passe"><svg class="icone"><use href="#i-oeil"/></svg></button>
    </div>
    <button type="submit" class="btn envoyer" data-attente="Connexion...">Se connecter <svg class="icone fleche"><use href="#i-fleche"/></svg></button>
    <p class="bascule">Pas encore de compte ? <a href="inscription.html">Créer un compte</a></p>
  </form>
</main>

<script src="commun.js"></script>
<script src="formulaire.js"></script>
<script>
// Maquette uniquement : ?erreur montre l'affichage d'une erreur de connexion
if (location.search.includes('erreur')) {
  document.getElementById('alerte').hidden = false;
  document.querySelector('.formulaire').classList.add('secoue');
}
</script>
</body></html>
