# En local : trois services separes (le site, l'API du pitch et la base Postgres).
# Lancement : docker compose up --build   puis ouvrir http://localhost:5000
# Les cles (SECRET_KEY, OPENAI_API_KEY) sont lues dans le fichier .env, jamais ecrites ici.

# Reglages communs au site et a l'API, repris plus bas avec "<<: *commun"
x-commun: &commun
  build: .
  image: cvboost
  env_file: .env
  environment:
    DATABASE_URL: postgresql://cvboost:${POSTGRES_PASSWORD:-cvboost_local}@db:5432/cvboost
    API_URL: http://api:8000
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cvboost
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cvboost_local}   # mot de passe local seulement
      POSTGRES_DB: cvboost
    volumes:
      - donnees:/var/lib/postgresql/data   # la base survit a l'arret des conteneurs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cvboost"]
      interval: 3s
      retries: 10

  api:
    <<: *commun
    command: uvicorn api_service.main:app --host 0.0.0.0 --port 8000
    # Pas de "ports" : l'API n'est joignable que par le site, dans le reseau prive de docker-compose

  web:
    <<: *commun
    command: gunicorn run:app --bind 0.0.0.0:5000 --workers 1 --threads 4 --timeout 30 --access-logfile -
    ports:
      - "5000:5000"

volumes:
  donnees:
